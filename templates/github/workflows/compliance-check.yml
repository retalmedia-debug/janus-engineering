# Template: janus-engineering@{{JANUS_SUITE_VERSION}}/templates/github/workflows/compliance-check.yml
# Standalone compliance check workflow — included in ci-base.yml by default.
# Copy this file only if you want a separate compliance workflow that runs independently.

name: JANUS Compliance

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly compliance check — catches drift from suite version upgrades
    - cron: '0 9 * * 1'

jobs:
  compliance:
    name: JANUS Compliance Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Download validate-compliance.sh
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/janus/janus-engineering/main/scripts/validate-compliance.sh \
            -o validate-compliance.sh
          chmod +x validate-compliance.sh

      - name: Run JANUS Compliance Check
        run: ./validate-compliance.sh --repo-path .

      - name: Check for template drift
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/janus/janus-engineering/main/scripts/check-standards-drift.sh \
            -o check-standards-drift.sh
          chmod +x check-standards-drift.sh
          ./check-standards-drift.sh || echo "::warning::Template drift detected. Review docs/ for outdated template versions."

      - name: Upload compliance report
        uses: actions/upload-artifact@ef09cdac3e2d3e60d8ccadda691f4f1cec5035cb
        if: always()
        with:
          name: compliance-report
          path: compliance-report.txt
          retention-days: 30
