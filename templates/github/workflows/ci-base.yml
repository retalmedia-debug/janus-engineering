# Template: janus-engineering@{{JANUS_SUITE_VERSION}}/templates/github/workflows/ci-base.yml
# Base CI workflow for JANUS services
# Replace {{SERVICE_REPO}} and adjust the jobs section for your service's tech stack

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compliance:
    name: JANUS Compliance Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run JANUS Compliance Check
        run: |
          curl -fsSL https://raw.githubusercontent.com/janus/janus-engineering/main/scripts/validate-compliance.sh \
            | bash -s -- --repo-path .

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b74142f6d13d7ad8b8ea4eacfe63dca9e8f8
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Lint
        run: pnpm eslint .

      - name: Format check
        run: pnpm prettier --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b74142f6d13d7ad8b8ea4eacfe63dca9e8f8
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # [[FILL: Add database setup steps if integration tests require a real database]]
      # Example for Supabase:
      # - name: Setup Supabase
      #   uses: supabase/setup-cli@78e603d2a2b5920c4df2cb9f70f0f1b2c7b1c3e4
      #   with:
      #     version: latest
      # - name: Start Supabase
      #   run: supabase start

      - name: Run tests
        run: pnpm test

      - name: Upload coverage
        uses: actions/upload-artifact@ef09cdac3e2d3e60d8ccadda691f4f1cec5035cb
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b74142f6d13d7ad8b8ea4eacfe63dca9e8f8
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency vulnerability scan
        run: pnpm audit --audit-level=high
