# Status values:
#   not-started          — service not yet proposed
#   proposed             — domain brief submitted, awaiting JAC review (Phase 0)
#   approved             — JAC approved the domain, repository not yet created (Gate 0.2 passed)
#   bootstrapping        — repository scaffolded, governance in progress (Phase 1-2)
#   governance-establishment — governance ratified, architecture in progress (Phase 2-3)
#   architecture         — architecture established, specification in progress (Phase 3-5)
#   implementation       — implementation authorized and in progress (Phase 6+)
#   production           — service live in production
#   maintenance          — service in long-term maintenance, no active feature development
#   deprecated           — service deprecated, consumers migrating
#   retired              — service retired and decommissioned
